[package]
name = "g729-sys-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
g729-sys = { path = ".." }

[workspace]

[[bin]]
name = "fuzz_decoder"
path = "fuzz_targets/fuzz_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_encoder"
path = "fuzz_targets/fuzz_encoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[profile.release]
# Fuzzing benefits from debug assertions (overflow/panic checks stay on).
debug-assertions = true
overflow-checks = true
