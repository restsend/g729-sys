[package]
name = "g729-sys"
version = "0.1.2"
edition = "2021"
authors = ["jinti<shenjindi@fourz.cn>"]
description = "Rust implementation of G.729 codec"
license = "MIT"
repository = "https://github.com/restsend/g729-sys"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false
